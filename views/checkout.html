<div class="container carrinho-container flex flex-wrap justify-center gap-10 p-6">

  <!-- Coluna dos Itens -->
  <div class="carrinho-itens flex-2 min-w-[300px] space-y-4">
    <!-- Exemplo de item -->
    <div class="item-card flex items-center bg-white border border-gray-200 rounded-lg p-4 shadow-md gap-4">
      <img src="../assets/images/coldbrew.jpg" class="item-img w-20 h-20 object-cover rounded" alt="Café Blend da Casa">
      <div class="item-details flex-grow">
        <h4 class="text-gray-900 text-lg font-semibold mb-1">Blend da Casa</h4>
        <p class="text-gray-500 text-sm">Descrição do produto</p>
        <div class="item-quantity flex items-center gap-2 mt-2">
          <button class="quantity-btn bg-amber-700 text-white w-8 h-8 rounded-full">-</button>
          <input type="text" class="quantity-input w-10 text-center border rounded" value="1">
          <button class="quantity-btn bg-amber-700 text-white w-8 h-8 rounded-full">+</button>
        </div>
      </div>
      <span class="item-price font-bold text-amber-700 min-w-[100px] text-right">R$ 38,00</span>
      <span class="item-remove text-gray-400 cursor-pointer hover:text-red-500">✕</span>
    </div>
  </div>

  <!-- Coluna do Resumo + Pagamento -->
  <div class="carrinho-resumo flex-1 min-w-[250px] bg-white border border-gray-200 rounded-lg p-6 shadow-md space-y-6">

    <!-- Resumo do Pedido -->
    <h3 class="text-gray-900 text-xl font-semibold border-b border-gray-200 pb-2 mb-4">Resumo do Pedido</h3>
    <div class="resumo-linha flex justify-between text-gray-700">
      <span>Subtotal (3 itens)</span>
      <span>R$ 209,00</span>
    </div>
    <div class="resumo-linha flex justify-between text-gray-700">
      <span>Frete Estimado</span>
      <span>R$ 25,00</span>
    </div>
    <div class="resumo-linha resumo-total flex justify-between font-bold text-amber-700 text-lg border-t-2 border-amber-700 pt-2 mt-2">
      <span>Total</span>
      <span>R$ 234,00</span>
    </div>

    <!-- Métodos de Pagamento -->
    <h3 class="text-gray-900 text-lg font-semibold mt-6 mb-4">Escolha o Método de Pagamento</h3>
    <div class="flex flex-col gap-3">

      <label class="metodo-opcao flex items-center gap-3 p-3 border border-gray-300 rounded-lg cursor-pointer hover:bg-gray-50">
        <input type="radio" name="pagamento" class="accent-amber-700">
        <span class="text-gray-700 font-medium">Cartão de Crédito</span>
      </label>

      <label class="metodo-opcao flex items-center gap-3 p-3 border border-gray-300 rounded-lg cursor-pointer hover:bg-gray-50">
        <input type="radio" name="pagamento" class="accent-amber-700">
        <span class="text-gray-700 font-medium">Pix</span>
      </label>

      <label class="metodo-opcao flex items-center gap-3 p-3 border border-gray-300 rounded-lg cursor-pointer hover:bg-gray-50">
        <input type="radio" name="pagamento" class="accent-amber-700">
        <span class="text-gray-700 font-medium">Boleto Bancário</span>
      </label>
    </div>

    <a href="checkout.html" class="btn-finalizar w-full block text-center bg-amber-700 hover:bg-amber-800 text-white rounded-lg py-3 font-semibold mt-4">Finalizar Compra</a>

  </div>
</div>
