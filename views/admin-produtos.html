<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel administrador - Produtos - Coffee</title>
    <link rel="stylesheet" href="../assets/css/navbar.css">
    <link rel="stylesheet" href="../assets/css/admin-panel.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <main class="admin-container">
        <h1>Painel do administrador - Produtos</h1>
        <p><a href="admin.html" class="link-voltar">&larr; Voltar ao painel principal</a></p>

        <div class="admin-actions">
            <button id="btn-show-add-modal" class="btn btn-primary"><i class="fas fa-plus"></i> Adicionar Novo Produto</button>
        </div>

        <section class="admin-section list-products-section">
            <h2>Produtos cadastrados em estoque</h2>
            <div class="table-container">
                <table id="products-table" class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Preço</th>
                            <th>Qtd.</th>
                            <th>Tipo</th>
                            <th>Origem</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="products-table-body">
                        <tr><td colspan="7">A carregar produtos...</td></tr>
                    </tbody>
                </table>
            </div>
            <p id="list-products-message" class="message"></p>
        </section>

        <div id="product-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close-modal-btn">&times;</span>
                <h2 id="modal-title">Adicionar Produto</h2>
                <form id="product-form" class="admin-form">
                    <input type="hidden" id="produtoId" name="IdProduto"> <div class="form-grid-modal">
                        <div class="form-group full-width">
                            <label for="nomeProduto">Nome:</label>
                            <input type="text" id="nomeProduto" name="nome" required>
                        </div>
                         <div class="form-group">
                            <label for="precoProduto">Preço (R$):</label>
                            <input type="number" step="0.01" id="precoProduto" name="preco" required>
                        </div>
                         <div class="form-group">
                            <label for="quantidadeProduto">Quantidade:</label>
                            <input type="number" id="quantidadeProduto" name="quantidade" value="0" required>
                        </div>
                        <div class="form-group">
                            <label for="tipoProduto">Tipo:</label>
                            <input type="text" id="tipoProduto" name="tipo">
                        </div>
                        <div class="form-group">
                            <label for="origemProduto">Origem:</label>
                            <input type="text" id="origemProduto" name="origem">
                        </div>
                        <div class="form-group">
                            <label for="intensidadeProduto">Intensidade:</label>
                            <input type="text" id="intensidadeProduto" name="intensidade">
                        </div>
                         <div class="form-group">
                            <label for="pesoProduto">Peso (Kg - Ex: 0.250):</label>
                            <input type="number" step="0.001" id="pesoProduto" name="peso">
                        </div>
                         <div class="form-group">
                            <label for="validadeProduto">Data de Validade:</label>
                            <input type="date" id="validadeProduto" name="dataDeValidade">
                        </div>
                        <div class="form-group full-width">
                            <label for="imagemProduto">URL da Imagem:</label>
                            <input type="url" id="imagemProduto" name="imagem">
                        </div>
                        <div class="form-group full-width">
                            <label for="descricaoProduto">Descrição:</label>
                            <textarea id="descricaoProduto" name="descricao" rows="4"></textarea>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" id="btn-save-product">Salvar Produto</button>
                    <p id="modal-message" class="message"></p>
                </form>
            </div>
        </div>

    </main>

    <script src="../assets/js/produtos.js" type="module"></script>
    <script src="../assets/js/admin-produtos.js" type="module"></script>

</body>
</html>
